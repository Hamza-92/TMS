name: tailor_app
description: Offline-first mobile foundation for the Tailor Management application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
